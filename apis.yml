apis:
- aid: a5x:a5x-technical-interfaces
  name: A5X Technical Interfaces
  description: >-
    The trading, market data and post-trade interfaces A5X exposes to exchange participants —
    order entry and drop copy over FIX, a binary market data feed, and post-trade capture,
    allocation, positioning and risk messaging. Message catalogs, session recovery rules, order
    identifier formats and field limits are documented in the A5X Dev Portal (Portal Tecnico),
    which requires credentials; no public machine-readable contract (OpenAPI, AsyncAPI, GraphQL SDL
    or downloadable FIX dictionary) is published at an anonymous URL, and the exchange had not begun
    production operations as of this profile.
  humanURL: https://portal-tecnico.a5x.com.br/login
