aid: a5x
name: A5X
description: >-
  A5X S.A. is a next-generation derivatives and futures exchange and clearing house being built for
  the Brazilian market, founded in 2023 in Sao Paulo by former XP executives Carlos Ferreira Filho and
  Karel Luketic together with Nilson Monteiro (Ideal) and Julian Chediak. It is an asset-light,
  technology-first venue running on London Stock Exchange Group trading, clearing and market
  surveillance technology, and it has raised R$385 million (about USD 72.6 million) from investors
  including IMC Trading, Jump Trading Group, Optiver, XTX Markets and ABN AMRO Clearing. Its listed,
  financially settled contract set covers stock index futures and options (local and offshore),
  single stock futures and options, currency futures and options, local interest rate futures and
  options, and cryptocurrency futures, with European-style options exercised automatically at expiry.
  For integrators, A5X publishes a technical developer portal covering connectivity (site-to-site VPN,
  LAN-to-LAN, cross connect at Equinix SP3, AWS Direct Connect), order entry, market data, drop copy
  and post-trade settlement, allocation, positioning and risk interfaces over FIX and binary
  protocols. The portal requires a login, so those specifications are not publicly readable.
